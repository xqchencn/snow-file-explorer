name: Release plugin

on:
  push:
    tags:
      - "v*.*.*"

# Release 需要写入仓库的 Releases。
permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tag version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const tag=process.env.TAG_NAME.replace(/^v/, ''); if (pkg.version !== tag) { console.error('Tag version ' + tag + ' does not match package.json version ' + pkg.version); process.exit(1); }"

      # 仓库当前不提交 package-lock.json，因此发布使用 package.json 安装依赖并禁用锁文件写入。
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Lint source
        run: npm run lint

      - name: Build distribution package
        run: npm run build

      - name: Test distribution package
        run: npm test

      - name: Create release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          asset="snow-file-explorer-${TAG_NAME}.zip"
          (cd dist && zip -r "../${asset}" .)
          sha256sum "${asset}" > "${asset}.sha256"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Snow File Explorer $TAG_NAME" \
              --generate-notes
          fi
          gh release upload "$TAG_NAME" \
            "$ASSET" \
            "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
